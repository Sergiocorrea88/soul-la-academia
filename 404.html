<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada | Soul La Academia</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/soul-la-academia/assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script>
/* Aplica el tema guardado ANTES de pintar la página.
   Si esto fuera al final del body, el visitante vería un
   parpadeo blanco antes de que entrara el tema oscuro. */
(function(){try{var t=localStorage.getItem("soul-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<link rel="stylesheet" href="/soul-la-academia/css/style.css">
<style>
  .nf {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .nf .code {
    font-family: "Rajdhani", sans-serif;
    font-size: clamp(80px, 18vw, 180px);
    font-weight: 700;
    line-height: 1;
    color: var(--violet-soft);
    margin: 0;
  }
  .nf img { width: 72px; margin-bottom: 28px; }
  .nf p { color: var(--text-dim); max-width: 460px; }
  .nf .btn { margin-top: 24px; }
</style>
</head>
<body>

<main class="nf">
  <img src="/soul-la-academia/assets/images/logo.png" alt="Soul La Academia">
  <p class="code">404</p>
  <h1>Esta página se salió de tono</h1>
  <p>El enlace que buscas no existe o cambió de lugar. Volvamos al inicio y seguimos desde ahí.</p>
  <a class="btn" href="/soul-la-academia/">Volver al inicio</a>
</main>

</body>
</html>
